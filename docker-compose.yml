services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: n8n
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d n8n"]
      interval: 5s
      timeout: 5s
      retries: 10

  n8n:
    image: n8nio/n8n:${N8N_VERSION:-latest}
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: ${POSTGRES_USER}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      GENERIC_TIMEZONE: ${TZ:-Europe/Warsaw}
      TZ: ${TZ:-Europe/Warsaw}
      WEBHOOK_URL: ${N8N_WEBHOOK_URL:-http://localhost:5678/}
      N8N_SECURE_COOKIE: "false"
      N8N_DIAGNOSTICS_ENABLED: "false"
      # Workflows read non-secret settings via $env. Secrets live in n8n credentials.
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      API_URL: http://api:3000
      LLM_PROVIDER: ${LLM_PROVIDER:-google}
      LLM_MODEL: ${LLM_MODEL}
      PRICE_LIST_SHEET_ID: ${PRICE_LIST_SHEET_ID}
      SLACK_CHANNEL: ${SLACK_CHANNEL}
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_started

  api:
    build: ./api
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      MAX_DISCOUNT_PERCENT: ${MAX_DISCOUNT_PERCENT:-10}
      LOG_LEVEL: ${LOG_LEVEL:-info}

volumes:
  postgres_data:
  n8n_data:
